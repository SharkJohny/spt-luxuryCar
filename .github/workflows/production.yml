on: push
name: 🚀 Deploy website on push
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # Nastavení Node.js
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      # Získání verze z git commitu (prvních 7 znaků SHA)
      - name: 🔖 Get build version
        id: version
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      # Instalace závislostí a build projektu
      - name: 🔨 Build Project
        run: |
          yarn install
          node truck/build-truck-images.mjs
          yarn esbuild assets/js/main.js --bundle --outfile=assets/js/luxuryCar.js --format=esm --loader:.jsx=jsx --minify --drop:console --legal-comments=none
          echo "{\"v\":\"${{ steps.version.outputs.sha }}\"}" > assets/js/version.json

      # Nahranie súborov cez SFTP (lftp — robí rekurzívne mkdir, funguje pre nové adresáre ako img/reviews/)
      - name: 📦 SFTP Upload (lftp)
        env:
          LFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp
          lftp -u git_444591 --env-password sftp://ftp.myshoptet.com -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            mirror -R --parallel=4 --exclude node_modules/ --exclude .git/ assets/ eshopy/luxuryCar/assets/;
            quit"
