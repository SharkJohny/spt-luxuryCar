<script>
(function(){var CZ=location.host.indexOf(".cz")>-1;
function fmt(n,s){var c=(String(s).match(/[^\d\s.,\u00A0]+$/)||[""])[0];return Math.round(n).toLocaleString("sk-SK").replace(/\u00A0/g," ")+" "+c;}
function lcdFix(){document.querySelectorAll(".parameter-cars .banner-header .save:not(.lcd-badge6)").forEach(function(el){if(el.querySelector(".lcd-save-label"))return;var t=(el.textContent||"").replace(/\u00A0/g," ").trim();var m=t.match(/^(.*?)([0-9][0-9 ]*(?:€|Kč))\s*$/);if(!m)return;el.innerHTML='<span class="lcd-save-label">'+m[1].trim()+'</span><strong>'+m[2].trim()+'</strong>';el.classList.add("lcd-badge6");});}
function bx(){var cards=document.querySelectorAll(".parameter-wrap.boxs .upsale-button"),one=null;
cards.forEach(function(c){var h=c.querySelector(".banner-header");if(!h)return;var t=(h.textContent||"").toLowerCase(),ti=h.querySelector(":scope > span");
if(ti&&!h.querySelector(".lcd-sub6")){var s=t.indexOf("1x box")>-1?"PRAKTICKÝ ORGANIZÉR":t.indexOf("2x box")>-1?(CZ?"DVOJNÁSOBNÝ PROSTOR":"DVOJITÁ KAPACITA"):null;if(s){var e=document.createElement("span");e.className="lcd-sub6";e.textContent=s;ti.insertAdjacentElement("afterend",e);}}
var sv=h.querySelector(".save.lcd-badge6");if(sv&&!sv.querySelector(".lcd-save-pct")){var a=parseFloat(sv.getAttribute("data-save")||"0"),r=h.querySelector(".price-recommended"),b=r?parseFloat(r.getAttribute("data-recommended")||"0"):0;if(a>0&&b>0){var p=document.createElement("span");p.className="lcd-save-pct";p.textContent="\u2212"+Math.round(a/b*100)+" %";sv.appendChild(p);}}
if(t.indexOf("1x box")>-1)one=c;
if(t.indexOf("2x box")>-1&&!c.classList.contains("lcd-top")){c.classList.add("lcd-top");c.setAttribute("data-lcd-top",CZ?"\u2605 NEJOBJEDNÁVANĚJŠÍ":"\u2605 NAJOBJEDNÁVANEJŠIE");}});
if(one){var os=one.querySelector(".save"),ost=os?os.querySelector("strong"):null,op=one.querySelector(".lcd-save-pct"),ov=os?parseFloat(os.getAttribute("data-save")||"0"):0;
cards.forEach(function(c){if(!/2x box/i.test(c.textContent||""))return;var s2=c.querySelector(".save");if(!s2||s2.getAttribute("data-lcd-x2")||!ov||!ost)return;var st=s2.querySelector("strong");if(!st)return;st.textContent=fmt(ov*2,ost.textContent);var p2=s2.querySelector(".lcd-save-pct");if(p2&&op)p2.textContent=op.textContent;s2.setAttribute("data-lcd-x2","1");});}}
function tr(){document.querySelectorAll(".parameter-wrap.trunk").forEach(function(sec){var k=[].slice.call(sec.querySelectorAll(".upsale-button")).filter(function(c){return /klasik/i.test((c.querySelector(".lcd-card-title")||{}).textContent||"");})[0];if(!k||k.querySelector(".lcd-upsale-badge"))return;var s=sec.querySelector(".lcd-upsale-badge");if(s)k.insertBefore(s.cloneNode(true),k.firstChild);});}
function run(){lcdFix();bx();tr();}
try{new MutationObserver(run).observe(document.body,{childList:true,subtree:true});}catch(e){}run();})();
</script>
